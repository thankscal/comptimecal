<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>國內補休差假結餘 計算器</title>
<style>
  :root{
    --bg:#f2f5f9; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
    --border:#e2e8f0; --input:#fafbfc;
    --accent:#2563eb; --accent-soft:#eff6ff;
    --ok:#059669; --ok-soft:#ecfdf5;
    --bad:#dc2626; --bad-soft:#fef2f2;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8;
      --border:#334155; --input:#0f172a;
      --accent:#60a5fa; --accent-soft:#1e3a5f;
      --ok:#34d399; --ok-soft:#064e3b;
      --bad:#f87171; --bad-soft:#7f1d1d;
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text); line-height:1.55;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:26px 16px 64px}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:.5px}
  .sub{color:var(--muted);margin:0 0 20px;font-size:13px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  @media (max-width:860px){.grid{grid-template-columns:1fr}}

  .card{
    background:var(--card);border:1px solid var(--border);
    border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);
    margin-bottom:16px;
  }
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  h2{font-size:14px;margin:0;letter-spacing:.5px;color:var(--muted);font-weight:600}
  .btns{display:flex;gap:8px}
  .btns.right{justify-content:flex-end;margin-top:10px}

  button{
    font:inherit;font-size:13px;cursor:pointer;border-radius:8px;
    border:1px solid var(--border);background:var(--card);color:var(--text);
    padding:6px 12px;transition:.15s;
  }
  button:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  button.small{padding:4px 10px;font-size:12px}

  textarea{
    width:100%;height:340px;resize:vertical;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12.5px;line-height:1.7;padding:10px 12px;
    border:1px solid var(--border);border-radius:10px;
    background:var(--input);color:var(--text);
  }
  textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}

  .hint{font-size:12px;color:var(--muted);margin:8px 0 0}

  .filterbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted)}
  .field.grow{flex:1;min-width:200px}
  .field.tiny{width:96px}
  select,input[type=date],input[type=number]{
    font:inherit;font-size:13px;padding:7px 9px;border-radius:8px;
    border:1px solid var(--border);background:var(--card);color:var(--text);
  }
  select,input[type=number]{width:100%}
  input:disabled{opacity:.45;cursor:not-allowed}
  select:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px}

  .total-box{
    background:var(--accent-soft);border-radius:12px;padding:16px;
    border:1px solid var(--border);
  }
  .total-label{font-size:12.5px;color:var(--muted);margin-bottom:4px}
  .total-value{
    font-size:30px;font-weight:800;letter-spacing:.5px;color:var(--accent);
    word-break:break-word;line-height:1.25;
  }
  .total-sub{font-size:12.5px;color:var(--muted);margin-top:6px}

  .declared{
    margin-top:12px;padding:10px 12px;border-radius:10px;font-size:13px;
    border:1px solid transparent;
  }
  .declared.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
  .declared.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
  .hidden{display:none}

  .muted{color:var(--muted);font-size:12px}
  .warncount{color:var(--bad);font-weight:700}

  .table-scroll{max-height:440px;overflow:auto;border:1px solid var(--border);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
  thead th{
    position:sticky;top:0;background:var(--card);z-index:1;
    font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.5px;
  }
  tbody tr.off{opacity:.4}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tfoot td{font-weight:700;background:var(--accent-soft);border-bottom:none}
  .status{font-size:12px}

  /* 到期警示 */
  td.warn{background:var(--bad-soft);color:var(--bad);font-weight:700}
  .badge{
    display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;
    font-size:11px;font-weight:700;vertical-align:middle;line-height:1.5;
  }
  .badge.soon,.badge.overdue{background:var(--bad);color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <h1>國內補休差假結餘 計算器</h1>
  <p class="sub">
    貼上清單即自動加總 · 換算規則：8 時 = 1 日、60 分 = 1 時
    · 警示基準日：<strong id="todayLabel">—</strong>
  </p>

  <div class="grid">
    <!-- 輸入 -->
    <section class="card">
      <div class="card-head">
        <h2>① 貼上資料</h2>
        <div class="btns">
          <button class="small" id="sampleBtn">載入範例</button>
          <button class="small" id="clearBtn">清空</button>
        </div>
      </div>
      <textarea id="input" spellcheck="false" placeholder="在此貼上「國內補休」清單…&#10;&#10;例如：&#10;2026&#9;0 日 3 時 12 分&#9;2026/05/08&#9;2027/05/07"></textarea>
      <p class="hint">每行需含「x 日 x 時 x 分」與兩個日期（生效日、到期日）。表頭、合計列等其餘文字會自動忽略。</p>
    </section>

    <!-- 結果 -->
    <section class="card">
      <div class="card-head"><h2>② 計算結果</h2></div>

      <div class="filterbar">
        <div class="field grow">
          <label for="filterType">篩選條件</label>
          <select id="filterType">
            <option value="none">全部加總</option>
            <option value="validOn">指定日當天仍有效（生效 ≤ X ≤ 到期）</option>
          </select>
        </div>
        <div class="field">
          <label for="filterDate">指定日</label>
          <input type="date" id="filterDate" disabled>
        </div>
      </div>

      <div class="total-box">
        <div class="total-label" id="totalLabel">總計</div>
        <div class="total-value" id="totalValue">—</div>
        <div class="total-sub" id="totalSub">尚未偵測到資料</div>
      </div>

      <div class="declared hidden" id="declaredBox"></div>

      <div class="btns right">
        <button class="small" id="copyBtn">複製總計</button>
      </div>
    </section>
  </div>

  <!-- 明細 -->
  <section class="card hidden" id="detailCard">
    <div class="card-head">
      <h2>③ 明細</h2>
      <div class="field tiny">
        <label for="warnDays">警示天數</label>
        <input type="number" id="warnDays" min="0" max="365" step="1" value="45">
      </div>
      <span class="muted" id="detailInfo"></span>
    </div>
    <div class="table-scroll">
      <table id="detailTable"></table>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";

  var DAY_MIN = 8 * 60;  // 1 日 = 480 分
  var MS_DAY  = 86400000;

  var inputEl      = document.getElementById('input');
  var filterTypeEl = document.getElementById('filterType');
  var filterDateEl = document.getElementById('filterDate');
  var warnDaysEl   = document.getElementById('warnDays');
  var totalLabelEl = document.getElementById('totalLabel');
  var totalValueEl = document.getElementById('totalValue');
  var totalSubEl   = document.getElementById('totalSub');
  var declaredBox  = document.getElementById('declaredBox');
  var detailCard   = document.getElementById('detailCard');
  var detailTable  = document.getElementById('detailTable');
  var detailInfo   = document.getElementById('detailInfo');
  var todayLabelEl = document.getElementById('todayLabel');
  var copyBtn      = document.getElementById('copyBtn');

  /* ---------- 今天（歸零到 00:00） ---------- */
  var TODAY = new Date();
  TODAY.setHours(0, 0, 0, 0);
  todayLabelEl.textContent = fmtDate(TODAY);

  /* ---------- 格式化 ---------- */
  function fmtFull(min){
    if (min < 0) min = 0;
    var d = Math.floor(min / DAY_MIN);
    var r = min % DAY_MIN;
    var h = Math.floor(r / 60);
    var m = r % 60;
    return d + ' 日 ' + h + ' 時 ' + m + ' 分';
  }
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function fmtDate(dt){
    if (!dt) return '—';
    return dt.getFullYear() + '/' + pad(dt.getMonth() + 1) + '/' + pad(dt.getDate());
  }
  function addDays(dt, n){
    var d = new Date(dt.getTime());
    d.setDate(d.getDate() + n);
    return d;
  }
  function daysBetween(a, b){ // b - a，以整天計
    return Math.round((b.getTime() - a.getTime()) / MS_DAY);
  }

  /* ---------- 解析 ---------- */
  function dateRe(){ return /\d{4}\s*[\/\-\.年]\s*\d{1,2}\s*[\/\-\.月]\s*\d{1,2}\s*日?/g; }

  function toDate(s){
    var m = s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    if (!m) return null;
    var y = +m[1], mo = +m[2], da = +m[3];
    if (mo < 1 || mo > 12 || da < 1 || da > 31) return null;
    return new Date(y, mo - 1, da);
  }

  function unit(str, re){
    var m = str.match(re);
    return m ? parseInt(m[1], 10) : null;
  }

  function parseRows(text){
    var rows = [];
    var lines = text.split(/\r?\n/);

    for (var i = 0; i < lines.length; i++){
      var line = lines[i].trim();
      if (!line) continue;

      var dates = line.match(dateRe());
      if (!dates || dates.length < 2) continue;

      // 先移除日期，避免「2026年05月08日」的「日」被誤判為天數
      var stripped = line.replace(dateRe(), ' ');

      var d  = unit(stripped, /(\d+)\s*[日天]/);
      var h  = unit(stripped, /(\d+)\s*(?:小時|時|时)/);
      var mi = unit(stripped, /(\d+)\s*分/);

      if (d === null && h === null && mi === null) continue;

      var start  = toDate(dates[0]);
      var expire = toDate(dates[1]);
      if (!start || !expire) continue;

      d = d || 0; h = h || 0; mi = mi || 0;

      rows.push({
        day: d, hour: h, min: mi,
        minutes: d * DAY_MIN + h * 60 + mi,
        start: start,
        expire: expire
      });
    }
    return rows;
  }

  // 從「餘假資訊」區塊抓官方總計，用來比對
  function findDeclared(text){
    var i = text.indexOf('餘假資訊');
    if (i < 0) return null;
    var tail = text.slice(i);
    var m = tail.match(/(\d+)\s*[日天]\s*(\d+)\s*(?:小時|時|时)\s*(\d+)\s*分/);
    if (!m) return null;
    return (+m[1]) * DAY_MIN + (+m[2]) * 60 + (+m[3]);
  }

  function parseDateInput(v){
    if (!v) return null;
    var p = v.split('-');
    if (p.length !== 3) return null;
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }

  /* ---------- 篩選（只剩「指定日當天仍有效」） ---------- */
  function matches(r, type, d){
    if (type !== 'validOn' || !d) return true;
    return r.start <= d && r.expire >= d;
  }

  function labelFor(type, d){
    if (type === 'validOn' && d) return fmtDate(d) + ' 當天仍有效';
    return '總計（全部）';
  }

  function updateDateState(){
    filterDateEl.disabled = (filterTypeEl.value !== 'validOn');
  }

  /* ---------- 主流程 ---------- */
  function render(){
    var rows = parseRows(inputEl.value);
    var type = filterTypeEl.value;
    var fd   = parseDateInput(filterDateEl.value);

    var warnDays = parseInt(warnDaysEl.value, 10);
    if (isNaN(warnDays) || warnDays < 0) warnDays = 45;
    var warnUntil = addDays(TODAY, warnDays);

    var total = 0, inc = 0, warnCount = 0;

    for (var i = 0; i < rows.length; i++){
      rows[i].included = matches(rows[i], type, fd);
      if (rows[i].included){ total += rows[i].minutes; inc++; }

      rows[i].daysLeft = daysBetween(TODAY, rows[i].expire);
      rows[i].isWarn   = rows[i].expire <= warnUntil;
      if (rows[i].isWarn) warnCount++;
    }

    totalLabelEl.textContent = labelFor(type, fd);

    if (rows.length === 0){
      totalValueEl.textContent = '—';
      totalSubEl.textContent = '尚未偵測到資料，請貼上清單。';
    } else {
      totalValueEl.textContent = fmtFull(total);
      totalSubEl.textContent =
        '計入 ' + inc + ' / ' + rows.length + ' 筆 · 總時數 ' +
        (total / 60).toFixed(2) + ' 小時（' + total + ' 分）';
    }

    /* 與「餘假資訊」比對（僅全部加總時） */
    var declared = findDeclared(inputEl.value);
    if (declared !== null && type === 'none' && rows.length > 0){
      var diff = total - declared;
      declaredBox.classList.remove('hidden');
      if (diff === 0){
        declaredBox.className = 'declared ok';
        declaredBox.textContent = '✓ 與「餘假資訊」的 ' + fmtFull(declared) + ' 相符';
      } else {
        declaredBox.className = 'declared bad';
        declaredBox.textContent = '與「餘假資訊」' + fmtFull(declared) +
          ' 相差 ' + fmtFull(Math.abs(diff)) + '（目前' + (diff > 0 ? '多' : '少') + '算）';
      }
    } else {
      declaredBox.classList.add('hidden');
    }

    /* 明細表 */
    if (rows.length === 0){
      detailCard.classList.add('hidden');
      detailTable.innerHTML = '';
      return;
    }
    detailCard.classList.remove('hidden');

    detailInfo.innerHTML = '共 ' + rows.length + ' 筆，依到期日排序 · ' +
      '警示 <span class="warncount">' + warnCount + '</span> 筆' +
      '（' + fmtDate(TODAY) + ' 起 ' + warnDays + ' 天內到期）';

    var sorted = rows.slice().sort(function(a, b){
      return (a.expire - b.expire) || (a.start - b.start);
    });

    var html = '<thead><tr>' +
      '<th class="num">#</th>' +
      '<th>差假結餘</th>' +
      '<th>生效日</th>' +
      '<th>到期日</th>' +
      '<th class="num">分鐘</th>' +
      '<th>狀態</th>' +
      '</tr></thead><tbody>';

    for (var j = 0; j < sorted.length; j++){
      var r = sorted[j];

      var badge = '';
      if (r.daysLeft < 0){
        badge = '<span class="badge overdue">已到期</span>';
      } else if (r.isWarn){
        badge = '<span class="badge soon">剩 ' + r.daysLeft + ' 天</span>';
      }

      html += '<tr class="' + (r.included ? '' : 'off') + '">' +
        '<td class="num">' + (j + 1) + '</td>' +
        '<td>' + fmtFull(r.minutes) + '</td>' +
        '<td>' + fmtDate(r.start) + '</td>' +
        '<td class="' + (r.isWarn ? 'warn' : '') + '">' +
          fmtDate(r.expire) + badge + '</td>' +
        '<td class="num">' + r.minutes + '</td>' +
        '<td class="status">' + (r.included ? '✓ 計入' : '— 排除') + '</td>' +
        '</tr>';
    }

    html += '</tbody><tfoot><tr>' +
      '<td colspan="4">合計（計入 ' + inc + ' 筆）</td>' +
      '<td class="num">' + total + '</td>' +
      '<td>' + fmtFull(total) + '</td>' +
      '</tr></tfoot>';

    detailTable.innerHTML = html;
  }

  /* ---------- 事件 ---------- */
  var timer = null;
  function schedule(){
    clearTimeout(timer);
    timer = setTimeout(render, 150);
  }

  inputEl.addEventListener('input', schedule);
  filterTypeEl.addEventListener('change', function(){ updateDateState(); render(); });
  filterDateEl.addEventListener('change', render);
  filterDateEl.addEventListener('input', render);
  warnDaysEl.addEventListener('input', render);

  copyBtn.addEventListener('click', function(){
    var txt = totalValueEl.textContent;
    if (!txt || txt === '—') return;
    var done = function(){
      var old = copyBtn.textContent;
      copyBtn.textContent = '已複製 ✓';
      setTimeout(function(){ copyBtn.textContent = old; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done).catch(function(){});
    } else {
      var ta = document.createElement('textarea');
      ta.value = txt;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch(e){}
      document.body.removeChild(ta);
    }
  });

  document.getElementById('clearBtn').addEventListener('click', function(){
    inputEl.value = '';
    render();
    inputEl.focus();
  });

  /* ---------- 範例資料 ---------- */
  var SAMPLE = [
'⌾國內補休',
'年份\t差假結餘\t生效日\t到期日',
'2026\t0 日 3 時 12 分\t2026/05/08\t2027/05/07',
'2026\t0 日 4 時 0 分\t2026/05/09\t2027/05/08',
'2026\t0 日 4 時 0 分\t2026/05/10\t2027/05/09',
'2026\t0 日 3 時 50 分\t2026/05/12\t2027/05/11',
'2026\t0 日 3 時 40 分\t2026/05/13\t2027/05/12',
'2026\t0 日 3 時 40 分\t2026/05/15\t2027/05/14',
'2026\t0 日 3 時 40 分\t2026/05/16\t2027/05/15',
'2026\t0 日 4 時 20 分\t2026/05/17\t2027/05/16',
'2026\t0 日 3 時 40 分\t2026/05/19\t2027/05/18',
'2026\t0 日 3 時 50 分\t2026/05/20\t2027/05/19',
'2026\t0 日 4 時 40 分\t2026/05/22\t2027/05/21',
'2026\t0 日 3 時 50 分\t2026/05/24\t2027/05/23',
'2026\t0 日 3 時 50 分\t2026/05/25\t2027/05/24',
'2026\t0 日 4 時 0 分\t2026/05/26\t2027/05/25',
'2026\t0 日 3 時 50 分\t2026/05/29\t2027/05/28',
'2026\t0 日 1 時 52 分\t2026/05/31\t2027/05/30',
'2026\t0 日 5 時 10 分\t2026/06/05\t2027/06/04',
'2026\t0 日 3 時 50 分\t2026/06/06\t2027/06/05',
'2026\t0 日 4 時 10 分\t2026/06/07\t2027/06/06',
'2026\t0 日 4 時 20 分\t2026/06/09\t2027/06/08',
'2026\t0 日 4 時 50 分\t2026/06/10\t2027/06/09',
'2026\t0 日 3 時 30 分\t2026/06/11\t2027/06/10',
'2026\t0 日 3 時 50 分\t2026/06/12\t2027/06/11',
'2026\t0 日 4 時 20 分\t2026/06/15\t2027/06/14',
'2026\t0 日 6 時 0 分\t2026/06/16\t2027/06/15',
'2026\t0 日 4 時 20 分\t2026/06/18\t2027/06/17',
'2026\t0 日 6 時 0 分\t2026/06/19\t2027/06/18',
'2026\t0 日 4 時 10 分\t2026/06/20\t2027/06/19',
'2026\t0 日 3 時 40 分\t2026/06/22\t2027/06/21',
'2026\t0 日 1 時 44 分\t2026/06/24\t2027/06/23',
'2026\t0 日 3 時 0 分\t2026/06/27\t2027/06/26',
'2026\t0 日 1 時 28 分\t2026/06/28\t2027/06/27',
'2026\t0 日 2 時 40 分\t2026/06/30\t2027/06/29',
'2026\t0 日 1 時 20 分\t2026/07/03\t2027/07/02',
'2026\t0 日 2 時 0 分\t2026/07/06\t2027/07/05',
'2026\t0 日 6 時 0 分\t2026/07/07\t2027/07/06',
'2026\t0 日 4 時 0 分\t2026/07/13\t2027/07/12',
'2026\t0 日 1 時 28 分\t2026/07/21\t2027/07/20',
'2026\t0 日 6 時 0 分\t2026/07/25\t2027/07/24',
'2026\t0 日 3 時 20 分\t2026/07/26\t2027/07/25',
'2026\t0 日 3 時 50 分\t2026/07/28\t2027/07/27',
'2026\t0 日 2 時 0 分\t2026/08/07\t2027/08/06',
'2026\t0 日 6 時 0 分\t2026/08/08\t2027/08/07',
'2026\t0 日 5 時 10 分\t2026/08/09\t2027/08/08',
